      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/cell-E
      - run:
          name: done garbage collecting watchdog
          command: |
            mkdir -p /tmp/cell-E
            { set +o pipefail 2>/dev/null; printf 'host=cache-a\nport=1629\nuser=max\ndebug=true\n' >${TMPDIR:-/tmp}/black.csv && grep -c = ${TMPDIR:-/tmp}/black.csv; true ; } > /tmp/cell-E/glaciergarden
            [ "$(stat -c %s /tmp/cell-E/glaciergarden)" -gt 0 ] && echo "stat size $(stat -c %s /tmp/cell-E/glaciergarden)"
      - persist_to_workspace:
          root: /tmp/cell-E
          paths:
            - 'glaciergarden'
  cloak792:
